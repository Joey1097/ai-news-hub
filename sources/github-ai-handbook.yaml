# GitHub 数据源配置 - AI Engineer Handbook
# 监控 DataExpert-io/ai-engineer-handbook 仓库更新

name: "AI Engineer Handbook"
description: "AI 工程师手册 - 全面的 AI 工程学习资源"
type: github
url: "https://github.com/DataExpert-io/ai-engineer-handbook"

# 检查频率
check_interval: "daily"  # 可选值: hourly, daily, weekly

# 分类标签
categories:
  - "学习资源"
  - "AI工程"
  - "GitHub"
  - "手册"

# 优先级
priority: high  # 可选值: low, medium, high, critical

# 内容筛选（可选）
filter:
  include_patterns:
    - "README.md"
    - "*.md"
  exclude_patterns:
    - "LICENSE"
    - ".gitignore"

# 通知设置
notifications:
  enabled: true
  on_new_release: true
  on_new_commit: false
  channels:
    - feishu
    - webchat

# 元数据
metadata:
  author: "DataExpert-io"
  language: "en"
  created_at: "2026-02-21"
  updated_at: "2026-02-21"
