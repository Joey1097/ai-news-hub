sources:
  github-ai-handbook:
    type: github
    name: "AI Engineer Handbook"
    url: "https://github.com/DataExpert-io/ai-engineer-handbook"
    check_interval: daily
    categories:
      - "AI工程"
      - "学习资源"
    priority: high
    
  cheerselfai-blog:
    type: web_scraper
    name: "CheerselfAI 林悦己"
    url: "https://cheerselfai.com/blog"
    check_interval: weekly
    categories:
      - "AI资料"
      - "提示词"
      - "工具推荐"
    priority: medium
    selectors:
      article: "article"
      title: "h2"
      link: "a"
      date: "time"
    
  cheerselfai-resources:
    type: web_scraper
    name: "CheerselfAI 资源"
    url: "https://cheerselfai.com/resources"
    check_interval: weekly
    categories:
      - "AI资料"
      - "学习资源"
    priority: medium
